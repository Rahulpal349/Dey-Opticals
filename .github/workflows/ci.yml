name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run lint
      run: npm run lint
      
    - name: Build Next.js app
      run: npm run build
      env:
        NEXT_PUBLIC_RAZORPAY_KEY_ID: dummy
        RAZORPAY_KEY_SECRET: dummy
        RAZORPAY_WEBHOOK_SECRET: dummy
        MONGODB_URI: dummy
        JWT_SECRET: dummy
